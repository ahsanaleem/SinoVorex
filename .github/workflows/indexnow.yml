# Pings IndexNow (Bing and others) after each successful production deploy on Vercel.
# Vercel reports deployments to GitHub, which triggers this workflow.
name: IndexNow after deploy

on:
  deployment_status:

jobs:
  indexnow:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/indexnow.mjs
